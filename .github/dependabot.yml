version: 2
updates:
  # pnpm workspace 根（pnpm-lock.yaml 在此）：依赖版本更新 PR
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    versioning-strategy: auto

  # GitHub Actions 版本更新
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
