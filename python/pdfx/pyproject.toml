[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfx"
version = "0.1.0"
description = "PDF layout extraction skeleton for paintbox"
requires-python = ">=3.10"
dependencies = ["pymupdf"]

[project.scripts]
pdfx = "pdfx.cli:main"

[tool.setuptools]
packages = ["pdfx", "pdfx.sources"]
