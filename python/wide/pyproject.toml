[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wide"
version = "0.1.0"
description = "paintbox wide-table merge tool"
requires-python = ">=3.10"
dependencies = ["pydantic>=2"]

[project.scripts]
wide = "wide.cli:main"

[tool.setuptools]
packages = ["wide"]
